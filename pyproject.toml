[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bsix"
version = "0.1.0"
authors = [
    {name = "Francisco Moreno Cano", email = "francisco.moreno@uco.es"}
]
description = "Benchmarking Survival analysis: Inference and eXplainability."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license-files = ["LICENSE"]
dependencies = [
    "config>=0.5.0",
    "h5py>=3.16.0",
    "joblib>=1.6.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.0",
    "mplcursors>=0.7",
    "numba>=0.68.0",
    "numpy>=2.5.0",
    "pandas>=3.0.0",
    "pycox>=0.3.0",
    "remayn>=1.0.9",
    "scikit-learn>=1.9.0",
    "scikit-survival>=0.28.0",
    "scipy>=1.18.0",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "submitit>=1.5.0",
    "tabpfn>=10.2.0",
    "torch>=2.15.0",
    "torchtuples>=0.2.0",
]

[project.urls]
Source = "https://github.com/ayrna/bsix"

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-timeout>=2.4",
]
dev = [
    "bsix[test]",
    "mypy==2.4",
    "ruff==0.17",
]
tutorial = [
    "ipywidgets",
    "ipympl",
    "jupyter",
]

[tool.setuptools.package-data]
"bsix.datasets" = ["*"]

[tool.setuptools.exclude-package-data]
"bsix.datasets.beatriz" = ["*"]

[tool.pytest.ini_options]
timeout = 900

[tool.mypy]
python_version = "3.12"
packages = ["bsix"]
files = ["tests"]

[[tool.mypy.overrides]]
module = [
    "config.*",
    "h5py.*",
    "joblib.*",
    "lifelines.*",
    "mplcursors.*",
    "pycox.*",
    "remayn.*",
    "shap.*",
    "sksurv.*",
    "statsmodels.*",
    "tabpfn.*",
    "torchtuples.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# Omit Numba, parallel execution, base.py (abstract class), and base models (comparison only)
omit = [
    "*/models/base.py",
    "*/models/metodologies/base*.py"
]