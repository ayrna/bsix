[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bsix"
version = "0.0.5"
authors = [
    {name = "Francisco Moreno Cano", email = "francisco.moreno@uco.es"}
]
description = "Benchmarking Survival analysis: Inference and eXplainability."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license-files = ["LICENSE"]
dependencies = [
    "h5py>=3.10",
    "joblib>=1.3",
    "lifelines>=0.29",
    "matplotlib>=3.8",
    "mplcursors>=0.5",
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.1",
    "pycox>=0.3",
    "remayn>=1.0",
    "scikit-learn>=1.4",
    "scikit-survival>=0.23",
    "scipy>=1.12",
    "shap>=0.45",
    "statsmodels>=0.14",
    "tabpfn>=2.0",
    "torch>=2.2",
    "torchtuples>=0.2",
]

[project.urls]
Source = "https://github.com/ayrna/bsix"

[project.optional-dependencies]
tutorial = [
    "jupyter",
    "ipywidgets",
    "ipympl",
]

execution = [
    "config>=0.5.1",
    "submitit>=1.5",
]

[tool.setuptools.package-data]
"bsix.datasets" = ["*"]

[tool.setuptools.exclude-package-data]
"bsix.datasets.beatriz" = ["*"]

[tool.coverage.run]
# Omit Numba, parallel execution, base.py (abstract class), and base models (comparison only)
omit = [
    "*/models/base.py",
    "*/models/metodologies/base*.py"
]