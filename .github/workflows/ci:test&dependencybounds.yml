name: CI Test & Dependency Bounds

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  min-bounds:
    name: Min bounds (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            constraints/py312-min.txt
            pyproject.toml

      - name: Install package and test tooling with minimum constraints
        run: >
          python -m pip install -c constraints/py312-min.txt ".[test]"

      - name: Show resolved versions
        run: python -m pip freeze | sort

      - name: Run tests
        run: pytest

  latest-bounds:
    name: Latest bounds (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and test tooling (latest versions)
        run: >
          python -m pip install --upgrade ".[test]"

      - name: Show resolved versions
        run: python -m pip freeze | sort

      - name: Run tests
        run: pytest