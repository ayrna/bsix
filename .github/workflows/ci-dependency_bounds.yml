name: CI Dependency Bounds

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  min-bounds:
    name: Min bounds (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install test tooling
        run: |
          python -m pip install "pytest>=8" "pytest-timeout>=2.3"

      - name: Install package with minimum constraints
        run: |
          python -m pip install -c constraints/py312-min.txt .

      - name: Show resolved versions
        run: |
          python -m pip freeze | sort

      - name: Run tests (exclude slow)
        run: |
          pytest -m "not slow"

  latest-bounds:
    name: Latest bounds (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install test tooling
        run: |
          python -m pip install --upgrade "pytest>=8" "pytest-timeout>=2.3"

      - name: Install package with latest dependencies
        run: |
          python -m pip install --upgrade .

      - name: Show resolved versions
        run: |
          python -m pip freeze | sort

      - name: Run tests (exclude slow)
        run: |
          pytest -m "not slow"
